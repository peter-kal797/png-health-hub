services:
  - type: web
    name: png-health-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: png-health-db
          property: connectionString
      - key: ASYNC_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SMS_MASTER_PSK
        generateValue: true
      - key: JWT_ALG
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      -  - key: CORS_ORIGINS
    value: "https://png-health-hub-frontend-s7qm.vercel.app,http://localhost:5173,http://127.0.0.1:5173"
      - key: LOG_LEVEL
        value: "INFO"

databases:
  - name: png-health-db
    plan: free
    databaseName: health_hub
    user: hub