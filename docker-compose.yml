services:
  postgres:
    image: postgres:16-alpine
    container_name: png_hub_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub_dev_pw
      POSTGRES_DB: health_hub
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d health_hub"]
      interval: 5s
      retries: 10

volumes:
  pgdata: